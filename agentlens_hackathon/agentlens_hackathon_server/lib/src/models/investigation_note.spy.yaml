class: InvestigationNote
table: investigation_note
fields:
  roomId: int, relation(parent=debug_room, onDelete=Cascade)
  roomCode: String
  findingId: int?
  authorName: String
  content: String
  createdAt: DateTime
indexes:
  investigation_note_room_idx:
    fields: roomCode
  investigation_note_finding_idx:
    fields: findingId
