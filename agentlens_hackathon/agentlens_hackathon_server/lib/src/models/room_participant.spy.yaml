class: RoomParticipant
table: room_participant
fields:
  roomId: int, relation(parent=debug_room, onDelete=Cascade)
  roomCode: String
  participantName: String
  deviceId: String
  participantTokenHash: String
  joinedAt: DateTime
  lastSeenAt: DateTime
  isOnline: bool, default=true
indexes:
  room_participant_room_code_idx:
    fields: roomCode
  room_participant_token_idx:
    fields: participantTokenHash
