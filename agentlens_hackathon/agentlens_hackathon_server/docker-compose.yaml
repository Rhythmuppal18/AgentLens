services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: agentlens_hackathon
      POSTGRES_PASSWORD: "8ePzB6PbyCEHBpVc2ATMzzia4kpK20K8"
    volumes:
      - agentlens_hackathon_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "Le8nZknrAatttNytkN4eeA_6xJTHEyKU"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: agentlens_hackathon_test
      POSTGRES_PASSWORD: "p2xFX1FxrcIYMKnQ2dg3dCTE_zzTwLDK"
    volumes:
      - agentlens_hackathon_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "CL4R94Yjb6MoKNjlKt2LOpQeYMUofyYT"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  agentlens_hackathon_data:
  agentlens_hackathon_test_data:
